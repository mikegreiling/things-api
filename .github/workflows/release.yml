name: Release
# Publishes to npm when a v* tag is pushed, then creates the matching GitHub
# Release from the tag's CHANGELOG section. The full check suite gates the
# publish twice: explicitly below (visible in logs, survives a package.json
# edit) and via the package's own prepublishOnly script.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC provenance)

jobs:
  # Sign + notarize "Things API Helper.app" so the published tarball carries a
  # ready-to-install helper bundle (no Xcode, no certificate, no build step on
  # the consumer's machine). Runs ONLY here, on a tag push: fork PRs never see
  # the secrets — GitHub withholds them by design — and the source +
  # scripts/build-helpers.sh remain the bring-your-own-identity path.
  #
  # One-time maintainer setup for the five secrets this job reads:
  # docs/design/release-signing.md.
  build-helpers:
    runs-on: macos-14
    env:
      BUNDLE: deputy/build/Things API Helper.app
      # NB: the `runner` context is not available in a job-level `env`, so the
      # keychain path is composed from $RUNNER_TEMP inside each step's shell.
      KEYCHAIN_NAME: release-signing.keychain-db
    steps:
      - uses: actions/checkout@v4

      # Fail the RELEASE, loudly, when signing is not configured. Shipping a
      # release without helpers must be a deliberate act (delete this job's
      # `needs:` edge), never an accident of a missing secret.
      - name: Verify the signing secrets are present
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSPHRASE: ${{ secrets.APPLE_CERT_PASSPHRASE }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$APPLE_CERT_P12" ] || missing="$missing APPLE_CERT_P12"
          [ -n "$APPLE_CERT_PASSPHRASE" ] || missing="$missing APPLE_CERT_PASSPHRASE"
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Helper signing secrets missing:${missing}. Set them per docs/design/release-signing.md, or drop the build-helpers dependency to ship a release without prebuilt helpers." >&2
            exit 1
          fi
          echo "all five signing secrets present"

      # Throwaway keychain: created here, deleted in the always() step below.
      # The real login keychain is never touched beyond its search-list order,
      # which the cleanup restores.
      - name: Import the Developer ID certificate into a throwaway keychain
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSPHRASE: ${{ secrets.APPLE_CERT_PASSPHRASE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/$KEYCHAIN_NAME"
          pass="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/certificate.p12"
          # openssl, not base64(1): the decode flag differs between macOS's
          # BSD base64 and GNU's, and openssl's -A accepts the secret whether
          # it was stored as one long line or wrapped.
          printf '%s' "$APPLE_CERT_P12" | openssl base64 -d -A > "$cert"
          security create-keychain -p "$pass" "$KEYCHAIN"
          # No lock-on-sleep, no idle timeout: codesign runs several steps later.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$pass" "$KEYCHAIN"
          security import "$cert" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSPHRASE" \
            -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          rm -f "$cert"
          # Without the partition list, codesign's access to the imported key
          # blocks on a GUI prompt that can never be answered on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$KEYCHAIN" >/dev/null 2>&1
          # Scope the keychain to this job: prepend it to the user search list
          # (keeping the login keychain) and make it the default.
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN"
          # A Developer ID leaf counts as a VALID identity only once its
          # intermediate can be found, and build-helpers.sh selects on
          # `find-identity -v`. Keychain Access normally exports the chain
          # inside the .p12; import Apple's intermediates too so a chainless
          # export cannot silently downgrade the release to an UNSIGNED bundle.
          for ca in DeveloperIDG2CA DeveloperIDCA; do
            if curl -fsSL -o "$RUNNER_TEMP/$ca.cer" "https://www.apple.com/certificateauthority/$ca.cer"; then
              security import "$RUNNER_TEMP/$ca.cer" -k "$KEYCHAIN" >/dev/null 2>&1 || true
            else
              echo "::warning::could not fetch the $ca intermediate — relying on the chain inside the .p12"
            fi
          done
          # Identity NAMES only — never the key material.
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::error::no VALID 'Developer ID Application' identity after import — the .p12 is missing its intermediate, or the certificate has expired. See docs/design/release-signing.md § Troubleshooting." >&2
            exit 1
          fi

      - name: Build the signed bundle
        run: bash scripts/build-helpers.sh

      # The nested sandboxed reader is what an Apple-issued chain buys (amfid
      # refuses ad-hoc and self-signed roots on sandboxed code), so its absence
      # means the certificate did not import as a Developer ID identity.
      - name: Verify both halves are present and signed
        run: |
          set -euo pipefail
          test -x "$BUNDLE/Contents/MacOS/things-deputy" || {
            echo "::error::things-deputy missing from the built bundle." >&2
            exit 1
          }
          test -x "$BUNDLE/Contents/Helpers/things-reader.app/Contents/MacOS/things-reader" || {
            echo "::error::nested things-reader missing — build-helpers.sh did not see a Developer ID Application identity." >&2
            exit 1
          }
          # A bundle carrying symlinks would not survive an npm tarball
          # faithfully; the build script emits none, and this keeps it so.
          if [ -n "$(find "$BUNDLE" -type l)" ]; then
            echo "::error::the bundle contains symlinks — npm tarballs are not a safe carrier for them." >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$BUNDLE"
          codesign --display --verbose=2 "$BUNDLE" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Timestamp)='

      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-key.p8"
          zip="$RUNNER_TEMP/helpers-notarize.zip"
          result="$RUNNER_TEMP/notarize.json"
          printf '%s' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          ditto -c -k --keepParent "$BUNDLE" "$zip"
          # notarytool prints only the JSON result; --wait blocks until Apple
          # reaches a verdict. Its exit code is not load-bearing here — the
          # status field is — so a failure still reaches the log fetch below.
          xcrun notarytool submit "$zip" \
            --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$result" || true
          status=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('status',''))" "$result" 2>/dev/null) || status=""
          id=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1])).get('id',''))" "$result" 2>/dev/null) || id=""
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization did not succeed (status='${status:-none}'). See docs/design/release-signing.md § Troubleshooting." >&2
            cat "$result" >&2 || true
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" >&2 || true
            fi
            rm -f "$key"
            exit 1
          fi
          rm -f "$key" "$zip"
          xcrun stapler staple "$BUNDLE"
          xcrun stapler validate "$BUNDLE"
          # The whole point of notarizing: Gatekeeper accepts the bundle
          # offline, from the stapled ticket alone.
          spctl --assess --type exec -vv "$BUNDLE"

      # tar, not upload-artifact's own zipping: v4 artifacts do not preserve
      # the executable bit, and a helper whose main executable comes back 0644
      # is a bundle launchd cannot start. COPYFILE_DISABLE keeps bsdtar from
      # scattering AppleDouble (._*) files through the bundle.
      - name: Archive the stapled bundle
        run: COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/helpers-bundle.tar.gz" -C deputy/build "Things API Helper.app"

      - uses: actions/upload-artifact@v4
        with:
          name: helpers-bundle
          path: ${{ runner.temp }}/helpers-bundle.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Delete the throwaway keychain
        if: always()
        run: |
          security default-keychain -s "$HOME/Library/Keychains/login.keychain-db" || true
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/$KEYCHAIN_NAME" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/asc-key.p8"

  publish:
    needs: build-helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      # Stamp the bundled agent skill with this release's version, so the
      # published tarball's SKILL.md carries a real `version:` (the repo copy
      # stays 0.0.0-dev). Visible in logs and survives a prepublishOnly edit;
      # prepublishOnly re-runs it as a belt-and-suspenders (idempotent).
      - run: node scripts/stamp-skill.mjs

      # Drop the notarized bundle into the one path the tarball ships it from
      # (deputy/prebuilt is gitignored — it exists only inside a release run).
      - uses: actions/download-artifact@v4
        with:
          name: helpers-bundle
          path: ${{ runner.temp }}/helpers
      - name: Stage the notarized helpers into the package
        run: |
          set -euo pipefail
          mkdir -p deputy/prebuilt
          tar -xzf "$RUNNER_TEMP/helpers/helpers-bundle.tar.gz" -C deputy/prebuilt
          deputy="deputy/prebuilt/Things API Helper.app/Contents/MacOS/things-deputy"
          reader="deputy/prebuilt/Things API Helper.app/Contents/Helpers/things-reader.app/Contents/MacOS/things-reader"
          for exe in "$deputy" "$reader"; do
            test -x "$exe" || { echo "::error::$exe missing or not executable after unpacking the artifact" >&2; exit 1; }
          done
      # The `files` allowlist is not self-proving: a bundle can be listed and
      # still fail to reach the tarball (directory name with a space, an
      # ignore-file interaction, a mode npm normalizes away). Assert it before
      # spending the version number.
      - name: Verify the helpers reach the tarball
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          node -e '
            const files = require("/tmp/pack.json")[0].files.map((f) => f.path);
            const want = [
              "deputy/prebuilt/Things API Helper.app/Contents/MacOS/things-deputy",
              "deputy/prebuilt/Things API Helper.app/Contents/Helpers/things-reader.app/Contents/MacOS/things-reader",
            ];
            const missing = want.filter((w) => !files.includes(w));
            if (missing.length) {
              console.error("::error::prebuilt helpers absent from the tarball: " + missing.join(", "));
              process.exit(1);
            }
            console.log("prebuilt helpers present in the tarball (" + files.length + " files total)");
          '
      # Trusted publishing: add this repo + workflow as a Trusted Publisher in
      # the package's settings on npmjs.com (Settings → Publishing access) —
      # then no token exists to leak. Until that's configured, create a
      # granular NPM_TOKEN repo secret and uncomment the env block.
      - run: npm publish
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Separate job so the npm-publishing job keeps contents: read.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release from CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          notes="$(awk -v ver="$version" '$0 ~ "^## " ver " " {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
            exit 0
          fi
          {
            echo "See [CHANGELOG.md](${changelog_url}) for full history."
            echo
            echo "$notes"
          } > /tmp/release-notes.md
          # GitHub rejects a release body longer than 125,000 characters (HTTP
          # 422). When this version's CHANGELOG section pushes the body past the
          # cap, keep the head and swap the tail for a truncation note linking
          # the full CHANGELOG — never fail the release. wc -c (bytes) is an
          # upper bound on character count, so a byte-budgeted cut stays safely
          # under the real character cap; the cut lands on a line boundary so
          # the body is always valid UTF-8 Markdown.
          cap=125000
          printf '\n\n---\n\n*Release notes truncated: this version'\''s CHANGELOG section exceeds GitHub'\''s %s-character release-body limit. See the [full CHANGELOG](%s) for the complete list of changes.*\n' "$cap" "$changelog_url" > /tmp/release-footer.md
          if [ "$(wc -c < /tmp/release-notes.md)" -gt "$cap" ]; then
            budget=$(( cap - $(wc -c < /tmp/release-footer.md) - 64 ))
            head -c "$budget" /tmp/release-notes.md | LC_ALL=C sed '$d' > /tmp/release-body.md
            cat /tmp/release-footer.md >> /tmp/release-body.md
            mv /tmp/release-body.md /tmp/release-notes.md
            echo "::notice::Release body exceeded ${cap} chars; truncated to $(wc -c < /tmp/release-notes.md) bytes."
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
