name: Release
# Publishes to npm when a v* tag is pushed, then creates the matching GitHub
# Release from the tag's CHANGELOG section. The full check suite gates the
# publish twice: explicitly below (visible in logs, survives a package.json
# edit) and via the package's own prepublishOnly script.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p 'require("./package.json").version')"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $pkg" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm run build
      # Stamp the bundled agent skill with this release's version, so the
      # published tarball's SKILL.md carries a real `version:` (the repo copy
      # stays 0.0.0-dev). Visible in logs and survives a prepublishOnly edit;
      # prepublishOnly re-runs it as a belt-and-suspenders (idempotent).
      - run: node scripts/stamp-skill.mjs
      # Trusted publishing: add this repo + workflow as a Trusted Publisher in
      # the package's settings on npmjs.com (Settings → Publishing access) —
      # then no token exists to leak. Until that's configured, create a
      # granular NPM_TOKEN repo secret and uncomment the env block.
      - run: npm publish
        # env:
        #   NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Separate job so the npm-publishing job keeps contents: read.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release from CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          changelog_url="https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          notes="$(awk -v ver="$version" '$0 ~ "^## " ver " " {flag=1; next} /^## / {flag=0} flag' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
            exit 0
          fi
          {
            echo "See [CHANGELOG.md](${changelog_url}) for full history."
            echo
            echo "$notes"
          } > /tmp/release-notes.md
          # GitHub rejects a release body longer than 125,000 characters (HTTP
          # 422). When this version's CHANGELOG section pushes the body past the
          # cap, keep the head and swap the tail for a truncation note linking
          # the full CHANGELOG — never fail the release. wc -c (bytes) is an
          # upper bound on character count, so a byte-budgeted cut stays safely
          # under the real character cap; the cut lands on a line boundary so
          # the body is always valid UTF-8 Markdown.
          cap=125000
          printf '\n\n---\n\n*Release notes truncated: this version'\''s CHANGELOG section exceeds GitHub'\''s %s-character release-body limit. See the [full CHANGELOG](%s) for the complete list of changes.*\n' "$cap" "$changelog_url" > /tmp/release-footer.md
          if [ "$(wc -c < /tmp/release-notes.md)" -gt "$cap" ]; then
            budget=$(( cap - $(wc -c < /tmp/release-footer.md) - 64 ))
            head -c "$budget" /tmp/release-notes.md | LC_ALL=C sed '$d' > /tmp/release-body.md
            cat /tmp/release-footer.md >> /tmp/release-body.md
            mv /tmp/release-body.md /tmp/release-notes.md
            echo "::notice::Release body exceeded ${cap} chars; truncated to $(wc -c < /tmp/release-notes.md) bytes."
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
